[project]
name = "apiscan"
version = "5.5.0"
description = "Universal API security scanner with OWASP API Top 10 and MCP audits"
requires-python = ">=3.11"
authors = [{ name = "Perry Mertens", email = "pamsniffer@gmail.com" }]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "tqdm>=4.66.0",
    "requests_ntlm>=1.2.0",
    "requests-oauthlib>=1.3.1",
    "oauthlib>=3.2.2",
    "PyJWT>=2.8.0",
    "sslyze>=6.2.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "colorama>=0.4.6",
    "markdown2>=2.4.10",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "openai>=1.0.0,<2.0.0",
    "azure-identity>=1.16.0",
    "orjson>=3.9.0; python_version>=\"3.8\"",
    "python-dateutil>=2.8.2",
    "PyYAML>=6.0.2",
    "anthropic>=0.67.0",
    "openapi-spec-validator>=0.7.2",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.15.0",
    "jsonschema>=4.18.0",
    "cryptography",
]

[project.optional-dependencies]
# Tkinter belongs to Python; it is not a pip dependency.
gui = ["pillow"]

[tool.uv]
# Run the existing scripts directly. setup.py is a bootstrap script, not a package build.
package = false
